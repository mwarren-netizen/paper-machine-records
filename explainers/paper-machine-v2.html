<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paper Machine v2 Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..800;1,7..72,400..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
@property --s{syntax:"<number>";inherits:true;initial-value:.62}
/* Layout concept: the v2 run as a counter-clockwise spiral of square stations, pinned left; a resizable panel on the right
   changes with the lens and the step you select. Sage paper and green-black ink, so it never reads as the blue v1 autopsy map. */
:root{
  --paper:#EEF2EC; --paper-2:#DFE7DD; --ink:#12291F; --ink-2:#43594D; --ink-3:#86998C; --rule:#C9D5CA; --tint:rgba(18,41,31,.06);
  --c-ground:#12788A; --c-vary:#4C861C; --c-reason:#C0335F; --c-select:#12291F; --c-freeze:#C27C0E; --c-human:#2949C9; --c-hi:#6B3FA0;
  --on-freeze:#12291F; --on-node:#F4F7F2;
  --keep:var(--c-ground); --rewrite:var(--c-vary); --fuse:var(--c-freeze); --new:var(--c-hi);
  --serif:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1714; --paper-2:#17251F; --ink:#E4EDE6; --ink-2:#A6B8AC; --ink-3:#65786C; --rule:#24382E; --tint:rgba(228,237,230,.07);
    --c-ground:#4FC2D3; --c-vary:#8FCB4E; --c-reason:#FF7099; --c-select:#E4EDE6; --c-freeze:#F2B640; --c-human:#86A0FF; --c-hi:#B990F2;
    --on-freeze:#0D1714; --on-node:#0D1714; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1714; --paper-2:#17251F; --ink:#E4EDE6; --ink-2:#A6B8AC; --ink-3:#65786C; --rule:#24382E; --tint:rgba(228,237,230,.07);
  --c-ground:#4FC2D3; --c-vary:#8FCB4E; --c-reason:#FF7099; --c-select:#E4EDE6; --c-freeze:#F2B640; --c-human:#86A0FF; --c-hi:#B990F2;
  --on-freeze:#0D1714; --on-node:#0D1714; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding-inline:20px}
.top{padding-block:18px 4px}
.eyebrow{margin:0 0 10px;font:650 12.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.vtag{display:inline-block;background:var(--c-vary);color:var(--on-node);border-radius:6px;padding:3px 8px;letter-spacing:.06em;font-weight:700}
h1{margin:0;font:760 clamp(30px,3.6vw,44px)/1 var(--serif);letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:italic;font-weight:600;color:var(--c-vary)}
.lede{margin:8px 0 0;max-width:54em;font:400 clamp(15.5px,1.35vw,17.5px)/1.45 var(--serif);color:var(--ink)}
.lenses{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lens{border:1.6px solid var(--ink);background:transparent;border-radius:8px;padding:9px 14px;font:650 14.5px/1 var(--sans);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.lens[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lens:hover:not([aria-pressed="true"]){background:var(--tint)}
.lens i{width:9px;height:9px;border-radius:2px;background:var(--c-human);display:none}
.lens[data-l="stops"] i{display:inline-block}
#lensq{margin:0;font:italic 400 17.5px/1.4 var(--serif);color:var(--ink-2);min-height:1.4em}
.qrow{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;margin-top:10px}
.layout{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 12.5px/1 var(--sans);color:var(--ink-2)}
.layout .lbl{letter-spacing:.07em;text-transform:uppercase;margin-right:2px}
.seg{border:1.4px solid var(--ink-3);background:transparent;border-radius:7px;padding:6px 12px;font:650 13px/1 var(--sans);cursor:pointer;color:var(--ink)}
.seg:hover{background:var(--tint)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--c-ground);outline-offset:3px}

.work{--w:22px;display:grid;grid-template-columns:minmax(0,calc((100% - var(--w))*var(--s))) var(--w) minmax(0,calc((100% - var(--w))*(1 - var(--s))));gap:0;align-items:start;padding-block:10px 40px;transition:--s .3s ease;position:relative}
.work.dragging{transition:none}
.work.collapsed .panel{visibility:hidden;overflow:hidden;padding:0;border:0;min-height:0}
.reopen{position:absolute;right:0;top:12px;z-index:5;border:1.6px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 14px;font:650 13.5px/1 var(--sans);cursor:pointer;box-shadow:0 2px 8px rgba(10,30,20,.15)}
.reopen:hover{background:var(--ink);color:var(--paper)}
.reopen[hidden]{display:none}
.split{align-self:stretch;position:relative;cursor:col-resize;touch-action:none;outline:none}
.split::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;margin-left:-1px;background:var(--rule);border-radius:2px;transition:background .15s}
.split::after{content:"";position:absolute;left:50%;top:min(42vh,320px);width:8px;height:44px;margin:0 0 0 -4px;border-radius:3px;background:var(--ink-3);transition:background .15s}
.split:hover::before,.split:focus-visible::before,.work.dragging .split::before{background:var(--ink)}
.split:hover::after,.split:focus-visible::after,.work.dragging .split::after{background:var(--ink)}
.split:focus-visible{outline:3px solid var(--c-ground);outline-offset:-3px;border-radius:6px}
.map{position:sticky;top:8px;min-width:0}
#spiral{display:block;width:100%;height:auto;max-height:calc(100vh - 96px);margin-inline:auto}
#spiral text{font-family:var(--sans)}
.t-op{font-size:15.5px;font-weight:700;fill:var(--ink)}
.t-turn{font-size:11px;font-weight:600;fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.t-num{font-weight:700;pointer-events:none}
.node{cursor:pointer;outline:none}
.node .body{transition:opacity .2s,fill .2s}
.node .halo{fill:none;stroke:transparent;stroke-width:3;transition:stroke .15s}
.node:hover .halo,.node:focus-visible .halo{stroke:var(--ink-2)}
.node.sel .halo{stroke:var(--ink);stroke-width:3.2}
.node.hl .halo{stroke:var(--ink);stroke-width:3.2}
.node .halo2{fill:none;stroke:transparent;stroke-width:3.2}
.node.dim{opacity:.28}
.node.dim:hover,.node.dim:focus-visible{opacity:.8}
.t-cnt{font-size:10.5px;font-weight:650;fill:var(--ink-2);pointer-events:none;font-variant-numeric:tabular-nums}
.spoke{stroke:var(--rule);stroke-width:1.2;stroke-dasharray:2 6}
.lane{fill:transparent;stroke:none;pointer-events:none;transition:fill .15s}
.lane.odd{fill:var(--tint)}
.lane.on{fill:var(--tint)}
@supports (color:color-mix(in oklab,red 10%,blue)){.lane.on{fill:color-mix(in oklab,var(--c-vary) 18%,transparent)}}
.tpath{fill:none;stroke:var(--ink-3);stroke-width:1.7;stroke-dasharray:7 4;pointer-events:none;transition:opacity .15s,stroke-width .15s}
#spiral.focus .tpath{opacity:.3}
#spiral.focus .tpath.on{opacity:1;stroke:var(--ink);stroke-width:3;stroke-dasharray:none}
.chev{fill:var(--ink-3);opacity:.85;pointer-events:none}
.leg{fill:none;stroke-linecap:round;pointer-events:none}
.leg.next{stroke:var(--c-vary);stroke-width:5}
.leg.prev{stroke:var(--ink-2);stroke-width:3;stroke-dasharray:1 7}
.legh{fill:var(--c-vary);pointer-events:none}
.node.offturn{opacity:.5}
.node.offturn.dim{opacity:.2}
.stopb rect{stroke-width:1.6}
.stopb{pointer-events:none}
.stopb text{font-size:10px;font-weight:700;pointer-events:none}
.stopb.solid rect{fill:var(--c-human);stroke:var(--c-human)}
.stopb.solid text{fill:var(--on-node)}
.stopb.outline rect{fill:var(--paper);stroke:var(--c-human)}
.stopb.outline text{fill:var(--c-human)}
.stopb.dashed rect{fill:var(--paper);stroke:var(--c-human);stroke-dasharray:3 2}
.stopb.dashed text{fill:var(--c-human)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 4px 0;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:18px;height:18px;flex:none;overflow:visible}

.panel{min-width:0;border-top:2.5px solid var(--ink);padding:10px 0 0 6px;min-height:560px}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--rule)}
.tab{border:0;border-bottom:3px solid transparent;background:transparent;padding:8px 14px 9px;font:650 14.5px/1 var(--sans);color:var(--ink-2);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c-vary)}
.tab:disabled{opacity:.45;cursor:default}
.p-top{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font:600 14px/1.3 var(--sans);color:var(--ink-2)}
.p-top .nav{margin-left:auto;display:flex;gap:6px}
.nbtn{border:1.4px solid var(--ink-3);background:transparent;border-radius:7px;padding:4px 11px;font:650 12.5px/1.2 var(--sans);cursor:pointer;color:var(--ink);white-space:nowrap}
.nbtn:hover{background:var(--tint)}
.nbtn[disabled]{opacity:.4;cursor:default}
.glance{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;margin:0 0 2px;font:400 13.5px/1.3 var(--sans);color:var(--ink-2)}
.glance .lk{border:0;background:transparent;padding:2px 0;font:650 13px/1.2 var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.glance .lk+.lk{margin-left:12px}
.p-num{font-weight:700;color:var(--ink);font-size:15px}
.panel h2{margin:4px 0 6px;font:720 clamp(24px,2.5vw,31px)/1.1 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.p-act{margin:0 0 10px;font:400 18px/1.4 var(--serif)}
.prose{font:400 16.5px/1.55 var(--serif);margin:0}
.prose+.prose{margin-top:.8em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.3px solid var(--rule);border-radius:7px;padding:2px 10px 2px 8px;font:500 13px/1.5 var(--sans);background:transparent;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:3px;background:var(--c,var(--ink-3));flex:none}
.chip.hollow i{background:transparent;box-shadow:inset 0 0 0 2px var(--c,var(--ink-3))}
.chip.stop{border-color:var(--c-human);color:var(--c-human);font-weight:700}
.chip.stop i{display:none}
button.chip{cursor:pointer}
button.chip:hover{background:var(--tint)}
details.sec{border-top:1px solid var(--rule)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;font:680 15px/1.3 var(--sans)}
details.sec>summary:hover .sh{text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px}
details.sec .st{display:grid;gap:2px;min-width:0}
details.sec .hint{font:italic 400 14px/1.35 var(--serif);color:var(--ink-2)}
details.sec[open] .hint{display:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .15s;margin-right:4px;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>.body{padding:0 0 16px}
.qs{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.qs li{font:400 16.5px/1.45 var(--serif);padding-left:22px;position:relative}
.qs li::before{content:"→";position:absolute;left:0;top:0;font:700 15px/1.5 var(--sans);color:var(--c-vary)}
.facts{margin:0;display:grid}
.facts div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--rule);font:400 14.5px/1.45 var(--sans)}
.facts div:first-child{border-top:0;padding-top:0}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0}
.facts dd.num{font-variant-numeric:tabular-nums}
.btn{border:1.6px solid var(--ink);background:transparent;border-radius:8px;padding:8px 16px;font:650 14px/1.2 var(--sans);cursor:pointer}
.btn:hover{background:var(--tint)}
.note{font:400 14px/1.45 var(--sans);color:var(--ink-2);margin:10px 0 0}
.callout{border-left:3px solid var(--c-vary);padding:2px 0 2px 14px;margin:14px 0}
.callout p{margin:0;font:400 16.5px/1.45 var(--serif)}
.callout .who{font:600 12.5px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:4px}
.hyp{border:1.6px dashed var(--ink-2);border-radius:8px;padding:10px 14px;margin:0 0 14px;font:400 15px/1.45 var(--sans);color:var(--ink)}
.hyp b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:0;margin:14px 0 6px;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.stat{padding:10px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat b{display:block;font:720 26px/1.05 var(--serif);font-variant-numeric:tabular-nums}
.stat span{font:500 12.5px/1.3 var(--sans);color:var(--ink-2)}
.turns{display:grid;gap:0;margin:8px 0 0;border-top:1px solid var(--rule)}
.turnrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:center}
.turnrow b{font:700 16px/1.2 var(--serif)}
.turnrow small{display:block;font:400 13px/1.3 var(--sans);color:var(--ink-2)}
.chips.tight{margin:0;gap:4px}
.chips.tight .chip{padding:0 8px;font-size:12.5px}
.srow{border-top:1px solid var(--rule)}
.srow>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0}
.srow>summary::-webkit-details-marker{display:none}
.sbadge{display:inline-grid;place-items:center;min-width:42px;height:22px;padding:0 6px;border-radius:5px;font:700 12px/1 var(--sans);border:1.8px solid var(--c-human)}
.sbadge.solid{background:var(--c-human);color:var(--on-node)}
.sbadge.outline{background:var(--paper);color:var(--c-human)}
.sbadge.dashed{background:var(--paper);color:var(--c-human);border-style:dashed}
.srow .what{font:600 15px/1.3 var(--sans)}
.srow .what small{display:block;font:400 13px/1.3 var(--sans);color:var(--ink-2)}
.srow .nec{font:600 12.5px/1.2 var(--sans);color:var(--ink-2);text-align:right;max-width:130px}
.srow .more{padding:0 0 14px 62px;font:400 14.5px/1.5 var(--sans)}
.srow .more p{margin:0 0 8px}
.srow .more b{font-weight:700}
.ghead{margin:18px 0 4px;font:700 12.5px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.bars{display:grid;gap:3px;margin:10px 0 0}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 34px;gap:8px;align-items:center;font:500 12.5px/1.25 var(--sans);cursor:pointer;border:0;background:transparent;padding:2px 4px;border-radius:6px;text-align:left}
.bar:hover,.bar.hl{background:var(--tint)}
.bar .tr{height:10px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.bar .tr i{display:block;height:100%;width:var(--w);background:var(--c)}
.bar em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right}
.item{border-top:1px solid var(--rule)}
.item>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0}
.item>summary::-webkit-details-marker{display:none}
.item .n{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 4px;border-radius:5px;background:var(--c-reason);color:var(--on-node);font:700 12.5px/1 var(--sans)}
.item .n.f{background:var(--c-freeze);color:var(--on-freeze)}
.item .n.g{background:var(--c-vary)}
.item .t{font:700 15.5px/1.3 var(--sans)}
.item .t small{display:block;font:400 13.5px/1.35 var(--sans);color:var(--ink-2);margin-top:2px}
.item .more{padding:0 0 14px 48px;font:400 15px/1.5 var(--sans)}
.item .more p{margin:0 0 8px}
.stack{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:0;counter-reset:s}
.stack li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--rule);font:400 14.5px/1.45 var(--sans);counter-increment:s}
.stack li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--ink);color:var(--paper);font:700 12px/1 var(--sans)}
.stack b{font-weight:700}
.maprow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--rule);font:400 14px/1.35 var(--sans)}
.maprow .code{font:700 13px/1 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums}
#peek{position:fixed;z-index:40;width:318px;max-width:calc(100vw - 16px);background:var(--paper);color:var(--ink);border:1.8px solid var(--ink);border-radius:8px;box-shadow:0 10px 30px rgba(10,30,20,.24);padding:10px 12px 11px;font:400 13.5px/1.4 var(--sans)}
#peek[hidden]{display:none}
#peek.pinned{border-color:var(--c-vary);box-shadow:0 10px 30px rgba(10,30,20,.24),0 0 0 3px color-mix(in oklab,var(--c-vary) 25%,transparent)}
.pk-h{display:flex;gap:8px;align-items:baseline}
.pk-n{font:700 14px/1.2 var(--sans)}
.pk-t{font:700 17px/1.2 var(--serif);flex:1;min-width:0}
.pk-m{color:var(--ink-2);font:600 12px/1.3 var(--sans);margin-top:3px}
.pk-a{font:400 15px/1.35 var(--serif);margin:7px 0 2px}
.pk-note{font:italic 400 13px/1.35 var(--serif);color:var(--ink-2);margin:4px 0 0}
.pk-b{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.pkb{border:1.4px solid var(--ink);background:transparent;border-radius:6px;padding:4px 10px;font:650 12.5px/1.2 var(--sans);cursor:pointer;color:var(--ink)}
.pkb:hover,.pkb:focus-visible{background:var(--ink);color:var(--paper)}
.pk-f{display:flex;gap:6px;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);padding-top:8px}
.pkn{border:0;background:transparent;color:var(--ink);font:650 12.5px/1.2 var(--sans);cursor:pointer;padding:3px 2px;text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px;text-align:left}
.pkn:hover{text-decoration-color:var(--ink)}
.pkn[disabled]{opacity:.35;cursor:default;text-decoration:none}
.pkn.go{border:1.4px solid var(--c-vary);color:var(--ink);border-radius:6px;padding:4px 10px;text-decoration:none}
.pkn.go:hover{background:var(--c-vary);color:var(--on-node)}
.fb{border:0;background:transparent;font:600 20px/1 var(--sans);cursor:pointer;color:var(--ink-2);padding:0 5px;border-radius:6px}
.fb:hover{color:var(--ink);background:var(--tint)}
#cards{position:fixed;inset:0;pointer-events:none;z-index:35}
.fcard{position:absolute;pointer-events:auto;width:min(390px,calc(100vw - 16px));max-height:min(72vh,600px);display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border:1.8px solid var(--ink);border-radius:8px;box-shadow:0 14px 36px rgba(10,30,20,.28)}
.fh{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 14px;border-bottom:1px solid var(--rule);cursor:grab;touch-action:none;user-select:none}
.fh:active{cursor:grabbing}
.fh .ft{flex:1;min-width:0;font:700 14.5px/1.2 var(--sans)}
.fh .ft small{display:block;font:italic 400 13.5px/1.3 var(--serif);color:var(--ink-2)}
.fbody{padding:10px 14px 14px;overflow:auto;overscroll-behavior:contain}
.fbody .prose{font-size:15.5px}
.fbody .qs li{font-size:15px}
.fbody .facts div{grid-template-columns:92px minmax(0,1fr)}
#tip{position:fixed;z-index:30;pointer-events:none;max-width:300px;background:var(--ink);color:var(--paper);font:500 13px/1.4 var(--sans);padding:8px 11px;border-radius:7px;opacity:0;transition:opacity .1s}

@media (max-width:980px){
  .work{grid-template-columns:1fr;transition:none}
  .split,.layout{display:none}
  .panel{padding-left:0;min-height:0}
  .map{position:static}
  #spiral{max-height:none}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .facts div{grid-template-columns:1fr;gap:2px}
  .srow>summary{grid-template-columns:50px minmax(0,1fr)}
  .srow .nec{grid-column:2;text-align:left;max-width:none}
  .srow .more,.item .more{padding-left:0}
  .bar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 30px}
  .turnrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .node .body,details.sec>summary::after,#tip,.work{transition:none}
}

/* ----- layout: how much of the screen the map and the details get ----- */
const PRESETS=[["only","Spiral only",1],["map","More spiral",0.68],["bal","Even",0.5],["read","More detail",0.36]];
const lay={auto:true,manual:0.5};
try{const j=JSON.parse(localStorage.getItem("pm2-layout")||"null");if(j){lay.auto=j.auto!==false;if(typeof j.manual==="number")lay.manual=j.manual;}}catch(e){}
function saveLay(){try{localStorage.setItem("pm2-layout",JSON.stringify(lay));}catch(e){}}
function bounds(){const W=Math.max(400,work.clientWidth-62);return{lo:Math.max(0.28,380/W),hi:Math.min(0.78,1-340/W)};}
function clampS(s){
  if(s>=0.995)return 1;
  const b=bounds();
  if(b.hi<b.lo)return 0.5;
  return Math.min(b.hi,Math.max(b.lo,s));
}
const isCollapsed=()=>work.classList.contains("collapsed");
function applyS(s){
  const v=clampS(s);
  work.style.setProperty("--s",v.toFixed(4));
  work.classList.toggle("collapsed",v>=1);
  reopen.hidden=!(v>=1);
  const pct=Math.round(v*100);
  split.setAttribute("aria-valuenow",pct);
  split.setAttribute("aria-valuetext",v>=1?"Spiral only, details hidden":"Spiral "+pct+" percent, details "+(100-pct)+" percent");
  kickPlace();
}
function autoTarget(){
  if(pBody.querySelector("details[open]"))return 0.42;
  if(st.tab==="stage"&&st.stage!==null)return 0.56;
  return 0.62;
}
function renderLayoutCtl(){
  ctl.innerHTML='<span class="lbl">Layout</span>'+PRESETS.map(p=>'<button class="seg" data-p="'+p[0]+'" aria-pressed="'+(!lay.auto&&Math.abs(lay.manual-p[2])<0.001)+'">'+p[1]+"</button>").join("")+
    '<button class="seg" data-p="auto" aria-pressed="'+lay.auto+'" title="Widen the details when you open a section">Auto</button>';
}
function autoLayout(){applyS(lay.auto?autoTarget():lay.manual);renderLayoutCtl();}
ctl.addEventListener("click",e=>{
  const b=e.target.closest("[data-p]");if(!b)return;
  if(b.dataset.p==="auto"){lay.auto=!lay.auto;}
  else{lay.auto=false;lay.manual=PRESETS.find(p=>p[0]===b.dataset.p)[2];}
  saveLay();autoLayout();
});
let dragging=false;
function endDrag(){if(!dragging)return;dragging=false;work.classList.remove("dragging");saveLay();}
split.addEventListener("pointerdown",e=>{e.preventDefault();dragging=true;work.classList.add("dragging");try{split.setPointerCapture(e.pointerId);}catch(x){}});
split.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const r=work.getBoundingClientRect(),padL=parseFloat(getComputedStyle(work).paddingLeft)||0,W=work.clientWidth-2*padL-22;
  const raw=(e.clientX-r.left-padL-11)/W;
  lay.auto=false;lay.manual=raw>0.86?1:clampS(raw);applyS(lay.manual);renderLayoutCtl();
});
split.addEventListener("pointerup",endDrag);
split.addEventListener("pointercancel",endDrag);
split.addEventListener("dblclick",()=>{lay.auto=true;saveLay();autoLayout();});
split.addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  e.preventDefault();
  const cur=parseFloat(work.style.getPropertyValue("--s"))||0.62,b=bounds(),dir=e.key==="ArrowRight"?1:-1;
  let nx;
  if(cur>=1)nx=dir<0?b.hi:1;
  else if(dir>0&&cur>=b.hi-0.001)nx=1;
  else nx=clampS(cur+dir*0.03);
  lay.auto=false;lay.manual=nx;saveLay();applyS(lay.manual);renderLayoutCtl();
});
window.addEventListener("resize",()=>{applyS(lay.auto?autoTarget():lay.manual);placePeek();});
reopen.addEventListener("click",()=>{lay.auto=true;saveLay();autoLayout();});

  if(isCollapsed()){lay.auto=true;saveLay();}
  selectStage(n);
  if(k){const d=pBody.querySelector('details.sec[data-k="'+k+'"]');if(d){d.open=true;d.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"});}}
  autoLayout();
}
function act(b){
  const v=b.dataset.v;
  switch(b.dataset.act){
    case "card":openCard(+v,b.dataset.k);break;
    case "peekgo":showPeek(+v,true);break;
    case "side":openSide(+v,b.dataset.k||null);break;
    case "stage":selectStage(+v);break;
    case "stop":st.lens="stops";st.tab="lens";st.hl=new Set();renderAll();openIn('details.srow[data-i="'+v+'"]');break;
    case "find":st.lens="find";st.tab="lens";st.hl=new Set();renderAll();openIn('details.item[data-i="'+v+'"]');break;
    case "from":st.lens="from";st.tab="lens";st.hl=new Set();renderAll();break;
    case "ring":st.ring=!st.ring;renderPanel();break;
    case "expandAll":pBody.querySelectorAll("details.sec").forEach(d=>{d.open=true;});break;
    case "collapseAll":pBody.querySelectorAll("details.sec").forEach(d=>{d.open=false;});break;
  }
}
pBody.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&!b.disabled)act(b);});

/* ----- the quick menu that opens when you hover a stage, and the floating cards ----- */
function peekHTML(n){
  const s=S[n],tn=turnOf(n),secs=sectionsFor(n);
  let note="";
  if(st.lens==="form")note=FORMS[s.form].name;
  else if(st.lens==="own")note=OWN[s.own].name;
  else if(st.lens==="from")note=VERD[s.v].name+": "+s.vt;
  else if(st.lens==="spend")note="About "+s.rep+(s.rep===1?" call":" calls")+" · "+s.set;
  else{const ps=stopsAt[n];if(ps.length)note="Stops here: "+ps.map(i=>STOPS[i].id).join(", ");}
  let h='<div class="pk-h"><span class="pk-n">'+pad(n)+'</span><span class="pk-t">'+esc(s.name)+'</span><button class="fb" data-peek="close" aria-label="Close the menu" title="Close (Esc)">×</button></div>';
  h+='<div class="pk-m">Turn '+tn.n+" of "+TURNS.length+" · "+esc(tn.name)+" · "+esc(s.opl)+"</div>";
  h+='<div class="pk-a">'+esc(s.act)+"</div>";
  if(note)h+='<div class="pk-note">'+esc(note)+"</div>";
  h+='<div class="pk-b">'+secs.map(sc=>'<button class="pkb" data-act="card" data-v="'+n+'" data-k="'+sc.k+'">'+esc(sc.label)+"</button>").join("")+"</div>";
  h+='<div class="pk-f"><button class="pkn" data-act="peekgo" data-v="'+(n-1)+'"'+(n===0?" disabled":"")+">← "+(n>0?pad(n-1):"")+'</button><button class="pkn go" data-act="side" data-v="'+n+'">Open side panel</button><button class="pkn" data-act="peekgo" data-v="'+(n+1)+'"'+(n===S.length-1?" disabled":"")+">"+(n<S.length-1?pad(n+1):"")+" →</button></div>";
  return h;
}
function placePeek(){
  if(!st.peek||peekEl.hidden)return;
  const nd=nodes[st.peek.n].g,r=nd.getBoundingClientRect(),m=svg.getScreenCTM();
  const cx=r.left+r.width/2,cy=r.top+r.height/2,w=peekEl.offsetWidth,h=peekEl.offsetHeight;
  let ux=1,uy=0;
  if(m){const ox=m.a*CX+m.e,oy=m.d*CY+m.f,dx=cx-ox,dy=cy-oy,L=Math.hypot(dx,dy);if(L>1){ux=dx/L;uy=dy/L;}}
  const gap=16+r.width/2;
  let x=ux>0.3?cx+gap:(ux<-0.3?cx-gap-w:cx-w/2);
  let y=uy>0.3?cy+gap:(uy<-0.3?cy-gap-h:cy-h/2);
  if(Math.abs(ux)<=0.3&&Math.abs(uy)<=0.3){x=cx+gap;y=cy-h/2;}
  x=Math.max(8,Math.min(innerWidth-w-8,x));y=Math.max(8,Math.min(innerHeight-h-8,y));
  peekEl.style.left=Math.round(x)+"px";peekEl.style.top=Math.round(y)+"px";
}
let placeUntil=0,placeBusy=false;
function kickPlace(){
  placeUntil=performance.now()+520;
  if(placeBusy)return;placeBusy=true;
  const tick=()=>{placePeek();if(performance.now()<placeUntil)requestAnimationFrame(tick);else placeBusy=false;};
  requestAnimationFrame(tick);
}
function showPeek(n,pinned){
  clearTimeout(showT);clearTimeout(hideT);showT=null;
  st.peek={n:n,pinned:!!pinned};st.hoverN=null;
  peekEl.innerHTML=peekHTML(n);peekEl.hidden=false;peekEl.classList.toggle("pinned",!!pinned);
  placePeek();paint();
}
function hidePeek(force){
  clearTimeout(showT);clearTimeout(hideT);showT=null;
  if(st.peek&&st.peek.pinned&&!force)return;
  const had=st.peek;
  st.peek=null;peekEl.hidden=true;
  if(!overN)st.hoverN=null;
  paint();
  return had;
}
function enterNode(n){
  overN=n;st.hoverN=n;paint();
  if(st.peek){if(st.peek.n===n)clearTimeout(hideT);return;}
  clearTimeout(showT);
  showT=setTimeout(()=>{showT=null;if(overN===n&&!st.peek)showPeek(n,false);},150);
}
function leaveNode(n){
  if(overN===n)overN=null;
  st.hoverN=null;paint();
  clearTimeout(showT);showT=null;
  if(st.peek&&!st.peek.pinned&&st.peek.n===n){clearTimeout(hideT);hideT=setTimeout(closeTransient,420);}
}
function closeTransient(){
  if(!st.peek||st.peek.pinned)return;
  hidePeek(false);
  if(overN!=null){const n=overN;showT=setTimeout(()=>{showT=null;if(overN===n&&!st.peek)showPeek(n,false);},150);st.hoverN=n;paint();}
}
peekEl.addEventListener("mouseenter",()=>{clearTimeout(hideT);st.hoverN=null;paint();});
peekEl.addEventListener("mouseleave",()=>{if(st.peek&&!st.peek.pinned){clearTimeout(hideT);hideT=setTimeout(closeTransient,420);}});
peekEl.addEventListener("click",e=>{
  const x=e.target.closest("[data-peek]");
  if(x){hidePeek(true);return;}
  const b=e.target.closest("[data-act]");if(b&&!b.disabled)act(b);
});
peekEl.addEventListener("keydown",e=>{if(e.key==="Escape"){const n=st.peek?st.peek.n:null;hidePeek(true);if(n!=null)nodes[n].g.focus();}});
window.addEventListener("scroll",placePeek,{passive:true});

const cards=[];let zTop=1;
function bringFront(c){if(c)c.el.style.zIndex=String(++zTop);}
function closeCard(c){const i=cards.indexOf(c);if(i>=0)cards.splice(i,1);c.el.remove();}
function openCard(n,k){
  const id=n+":"+k,ex=cards.find(c=>c.id===id);
  if(ex){bringFront(ex);return;}
  const sc=sectionsFor(n).find(x=>x.k===k);if(!sc)return;
  const el=document.createElement("div");
  el.className="fcard";el.setAttribute("role","dialog");el.setAttribute("aria-label",pad(n)+" "+sc.title);
  el.innerHTML='<div class="fh"><span class="ft">'+pad(n)+" · "+esc(S[n].name)+"<small>"+esc(sc.title)+'</small></span><button class="fb" data-card="side" title="Open in the side panel" aria-label="Open in the side panel">↗</button><button class="fb" data-card="close" title="Close" aria-label="Close this card">×</button></div><div class="fbody">'+sc.body+"</div>";
  cardsEl.appendChild(el);
  const c={id:id,n:n,k:k,el:el};cards.push(c);
  const r=nodes[n].g.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,off=((cards.length-1)%5)*26;
  let x=r.right+20+off;if(x+w>innerWidth-8)x=r.left-w-20-off;
  let y=r.top-50+off;
  x=Math.max(8,Math.min(innerWidth-w-8,x));y=Math.max(8,Math.min(innerHeight-h-8,y));
  el.style.left=Math.round(x)+"px";el.style.top=Math.round(y)+"px";
  while(cards.length>5)closeCard(cards[0]);
  bringFront(c);
}
cardsEl.addEventListener("click",e=>{
  const ce=e.target.closest(".fcard");if(!ce)return;
  const c=cards.find(x=>x.el===ce);if(!c)return;
  bringFront(c);
  const cb=e.target.closest("[data-card]");
  if(cb){if(cb.dataset.card==="close")closeCard(c);else{openSide(c.n,c.k);closeCard(c);}return;}
  const b=e.target.closest("[data-act]");if(b&&!b.disabled)act(b);
});
cardsEl.addEventListener("pointerdown",e=>{
  const h=e.target.closest(".fh");if(!h||e.target.closest("button"))return;
  const ce=h.parentElement,c=cards.find(x=>x.el===ce);if(!c)return;
  const r=ce.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
  bringFront(c);
  try{h.setPointerCapture(e.pointerId);}catch(x){}
  const move=ev=>{
    const x=Math.max(60-r.width,Math.min(innerWidth-60,ev.clientX-dx)),y=Math.max(0,Math.min(innerHeight-40,ev.clientY-dy));
    ce.style.left=Math.round(x)+"px";ce.style.top=Math.round(y)+"px";
  };
  const up=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);};
  h.addEventListener("pointermove",move);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(st.peek){hidePeek(true);return;}
  if(cards.length)closeCard(cards[cards.length-1]);
});
document.addEventListener("click",e=>{
  if(e.composedPath().some(x=>x.matches&&x.matches(".node,#peek,.fcard")))return;
  if(st.peek&&st.peek.pinned)hidePeek(true);
});
pBody.addEventListener("toggle",e=>{const d=e.target;if(!d.matches||!d.matches("details"))return;if(d.matches("[data-hl]"))recomputeHL();autoLayout();},true);
pBody.addEventListener("mouseover",e=>{const b=e.target.closest("[data-hover]");if(b)nodes[+b.dataset.hover].g.classList.add("hl");});
pBody.addEventListener("mouseout",e=>{const b=e.target.closest("[data-hover]");if(b&&!b.contains(e.relatedTarget))nodes[+b.dataset.hover].g.classList.toggle("hl",st.hl.has(+b.dataset.hover));});

buildSpiral();
renderAll();
paint();
})();
</script>

</body></html>
